<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Jokiny</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
</head>
<body data-page="connexion">

  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="site-header">
    <div class="container site-header__bar">
      <a class="brand" href="index.html"><span class="brand__mark">SO</span> Jokiny</a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="index.html" data-nav-link="accueil">Accueil</a>
        <a href="catalogue-services.html" data-nav-link="catalogue">Services</a>
        <a href="assistant.html" data-nav-link="assistant">Assistant</a>
        <a href="faq.html" data-nav-link="faq">FAQ</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn--primary" href="inscription.html">Créer un compte</a>
      </div>
    </div>
  </header>

  <main id="contenu" class="container" style="display:flex; justify-content:center; padding-block: var(--space-8)">
    <form class="form-card">
      <h2>Connexion</h2>
      <p style="color:var(--color-ink-soft); margin-bottom: var(--space-5)">
        Accédez à vos demandes et rendez-vous.
      </p>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input class="input" type="email" id="email" name="email" required />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input class="input" type="password" id="password" name="password" required />
        <p class="field__hint"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Se connecter</button>

      <p style="text-align:center; margin-top: var(--space-5); font-size: var(--text-sm)">
        Pas encore de compte ? <a href="inscription.html">Inscrivez-vous</a>
      </p>
    </form>
  </main>

  <script src="../../js/main.js"></script>
</body>
</html>
